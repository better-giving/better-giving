packages:
  - 'packages/*'
catalog:
  # a catalog entry earns its place by having a second package.json to drift against. `@types/node`,
  # `typescript`, `vite` and `vitest` are each declared by three or more of the packages, and
  # `happy-dom` by packages/app, packages/form and packages/operator. `@ark-ui/react` is declared by
  # every package that renders an operator screen or previews one, and the drift it would carry is
  # sharper than a version number: two of them would be two copies of one state machine, and a
  # screen that renders a part from each is a trigger and a card that do not know about each
  # other. the react family — `react`, `react-dom`, `@types/react`, `@types/react-dom` — is here
  # on the same rule: every package that renders react declares it.
  #
  # `react` carries a second reason on top of that one: a second copy in one tree is a second
  # runtime — a component resolved against its own react dispatcher — so the pin is what keeps
  # every package on one. its floor is react-router's, which peers `react >= 19.2.7` at 8.3.0. the
  # react-router family carries it too, and more sharply: `react-router` holds the router's own
  # module state, so two copies in one tree are two routers, and `@react-router/dev` writes the
  # types the other two are read against — the three move together or not at all.
  #
  # `@zag-js/combobox`, `@zag-js/select` and `@zag-js/vanilla` are declared by packages/form alone,
  # and the second package.json they drift against is `@ark-ui/react`'s own: they are the machines
  # it carries, so the embed and the `/donate` page run one select only while these equal the
  # `@zag-js/*` version that `@ark-ui/react` pins. bump them with it or not at all.
  #
  # the workspace root takes `typescript` from the catalog as well, so a root opened in an editor
  # resolves the same compiler every package type-checks with rather than whatever happens to be on
  # the machine. the root declares nothing else of any package's: only what lints and formats.
  #
  # @vitest/browser-playwright is version-coupled to vitest too but stays pinned in
  # packages/form/package.json alone, which has the browser specs. a single consumer has nothing to
  # drift against, and an entry here would claim otherwise.
  #
  # `xstate` is here on react's rule rather than on the count: two copies in one tree are two
  # runtimes, and an actor started on a copy other than the one the machine was built with is a flow
  # whose types match and whose identity does not. packages/form declares it for the machine, and
  # every package that builds an actor on that machine takes the same entry — which is what makes
  # them equal structurally rather than by review.
  #
  # `zod` and the `@conform-to/*` pair carry a coupling worth stating: `@conform-to/zod` is
  # version-locked to `@conform-to/react`, and both are read against the `zod` major — packages/app
  # alone declares them today; they stay catalogued so the pair and the `zod` major move together.
  #
  # the `@tiptap/*` set earns its catalog entry on a different rule from the rest: packages/app
  # alone declares it, but it is one block: `@tiptap/core`, `@tiptap/pm` and `@tiptap/react` peer on each
  # other at this exact version, and every `@tiptap/extension-*` package here peers on
  # `@tiptap/core` at the same exact version, so the set moves together or not at all. it is the
  # minimal set for bold, italic, bullet and numbered lists, and links — `@tiptap/extension-list`
  # carries `BulletList`, `OrderedList` and `ListItem`.
  '@ark-ui/react': 5.39.2
  '@conform-to/react': 1.21.1
  '@conform-to/zod': 1.21.1
  '@react-router/dev': 8.3.0
  '@react-router/fs-routes': 8.3.0
  '@tiptap/core': 3.31.3
  '@tiptap/extension-bold': 3.31.3
  '@tiptap/extension-document': 3.31.3
  '@tiptap/extension-italic': 3.31.3
  '@tiptap/extension-link': 3.31.3
  '@tiptap/extension-list': 3.31.3
  '@tiptap/extension-paragraph': 3.31.3
  '@tiptap/extension-text': 3.31.3
  '@tiptap/pm': 3.31.3
  '@tiptap/react': 3.31.3
  '@types/node': 24.13.3
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.4
  '@zag-js/combobox': 1.43.3
  '@zag-js/select': 1.43.3
  '@zag-js/vanilla': 1.43.3
  happy-dom: 20.11.1
  react: 19.2.8
  react-dom: 19.2.8
  react-router: 8.3.0
  typescript: 6.0.3
  vite: 8.1.5
  vitest: 4.1.10
  xstate: 5.32.5
  zod: 4.4.3
# a machine installs the bindings for its own os and cpu, and only the glibc build of a native
# package: the image is glibc, and a Mac or a Linux runner has no use for the musl variant that
# otherwise comes with every prebuilt binary. the lockfile still lists every variant.
supportedArchitectures:
  os: [current]
  cpu: [current]
  libc: [glibc]
# better-auth peers `next` as optional, and pnpm resolves an optional peer whenever some importer
# holds a copy: `@react-email/ui` carries one. it is not ours at runtime, so it stays out of the
# production install.
#
# `@react-router/dev` peers `wrangler` as optional, and pnpm resolves it whenever any package in the
# graph carries a copy. nothing here runs wrangler, so it stays out of the install.
overrides:
  'better-auth>next': '-'
  '@react-router/dev>wrangler': '-'
