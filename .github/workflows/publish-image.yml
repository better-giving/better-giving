# publishes the root Dockerfile's image to ghcr.io/better-giving/better-giving. this is the only
# workflow that holds `packages: write`, so it triggers on a push to main or a `v*` tag alone: a pull
# request or a fork never reaches a registry login (ci.yml's docker-build builds the same image and
# discards it).
name: publish-image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

# two pushes must not race to move `:main`; the later one waits for the earlier.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/better-giving/better-giving

jobs:
  publish:
    name: publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 is built under emulation; the amd64 half is native.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # a push to main publishes `:main` and `:<sha>`, versioned by the sha. a tag push publishes
      # `:<tag>` and `:<sha>`, versioned by the tag, and never moves `:main`; no tag gets `:latest`.
      # the ref name reaches the shell through env, never interpolated into the script.
      - name: image tags
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            # a git tag may hold characters a docker tag refuses (`/`); fail here, before the build.
            if ! printf '%s' "$REF_NAME" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "tag '$REF_NAME' is not a valid image tag" >&2
              exit 1
            fi
            version=$REF_NAME
            first=$REF_NAME
          else
            version=$SHA
            first=main
          fi
          {
            echo "version=$version"
            echo "tags<<TAGS_EOF"
            echo "$IMAGE:$first"
            echo "$IMAGE:$SHA"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          build-args: |
            BETTER_GIVING_VERSION=${{ steps.meta.outputs.version }}
          # `source` is what makes ghcr list the package under the repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # its own scope: ci.yml's docker-build is single-arch and would otherwise share this cache.
          cache-from: type=gha,scope=publish-image
          cache-to: type=gha,scope=publish-image,mode=max
