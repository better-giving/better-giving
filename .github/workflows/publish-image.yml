# publishes the root Dockerfile's image to ghcr.io/better-giving/better-giving. this is the only
# workflow that holds `packages: write`, so it triggers on push to main alone: a pull request or a
# fork never reaches a registry login (ci.yml's docker-build builds the same image and discards it).
name: publish-image

on:
  push:
    branches: [main]
  # versioned tags wait for the first Docker release. when it exists, add
  #   tags: ['v*']
  # here and a `type=semver` rule in a docker/metadata-action step beside the two tags below.

permissions:
  contents: read
  packages: write

# two pushes to main must not race to move `:main`; the later one waits for the earlier.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/better-giving/better-giving

jobs:
  publish:
    name: publish
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # arm64 is built under emulation; the amd64 half is native.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:${{ github.sha }}
          build-args: |
            BETTER_GIVING_VERSION=${{ github.sha }}
          # `source` is what makes ghcr list the package under the repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # its own scope: ci.yml's docker-build is single-arch and would otherwise share this cache.
          cache-from: type=gha,scope=publish-image
          cache-to: type=gha,scope=publish-image,mode=max
