# publishes the root Dockerfile's image to ghcr.io/better-giving/better-giving for linux/amd64 and
# linux/arm64. this is the only workflow that holds `packages: write`, so it triggers on a push to
# main or a `v*` tag alone: a pull request or a fork never reaches a registry login (ci.yml's
# docker-build builds the same image and discards it).
#
# each platform builds natively on its own runner and pushes `:<sha>-<arch>`; `manifest` then joins
# the two into the multi-platform tags. arm64 is never emulated: under QEMU the build ran past 2h.
name: publish-image

on:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read
  packages: write

# two pushes must not race to move `:main`; the later one waits for the earlier.
concurrency:
  group: publish-image
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/better-giving/better-giving

jobs:
  # a push to main publishes `:main` and `:<sha>`, versioned by the sha. a tag push publishes
  # `:<tag>` and `:<sha>`, versioned by the tag, and never moves `:main`; no tag gets `:latest`.
  # the ref name reaches the shell through env, never interpolated into the script.
  tags:
    name: image tags
    runs-on: blacksmith-4vcpu-ubuntu-2404
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tags: ${{ steps.meta.outputs.tags }}
    steps:
      - name: image tags
        id: meta
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$REF_TYPE" = tag ]; then
            # a git tag may hold characters a docker tag refuses (`/`); fail here, before the build.
            if ! printf '%s' "$REF_NAME" | grep -Eq '^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$'; then
              echo "tag '$REF_NAME' is not a valid image tag" >&2
              exit 1
            fi
            version=$REF_NAME
            first=$REF_NAME
          else
            version=$SHA
            first=main
          fi
          {
            echo "version=$version"
            echo "tags<<TAGS_EOF"
            echo "$IMAGE:$first"
            echo "$IMAGE:$SHA"
            echo "TAGS_EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.arch }}
    needs: tags
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: blacksmith-4vcpu-ubuntu-2404
          - platform: linux/arm64
            arch: arm64
            runner: blacksmith-4vcpu-ubuntu-2404-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          push: true
          # the per-arch tag is the hand-off to `manifest`; it is not a published name.
          tags: ${{ env.IMAGE }}:${{ github.sha }}-${{ matrix.arch }}
          build-args: |
            BETTER_GIVING_VERSION=${{ needs.tags.outputs.version }}
          # `source` is what makes ghcr list the package under the repository.
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          # one scope per arch: ci.yml's docker-build is amd64 and would otherwise share this cache,
          # and the two halves must not overwrite each other's.
          cache-from: type=gha,scope=publish-image-${{ matrix.arch }}
          cache-to: type=gha,scope=publish-image-${{ matrix.arch }},mode=max

  # joins the two per-arch images (already in the registry) under each final tag. `imagetools
  # create` takes one `--tag` per call, so it runs once per tag.
  manifest:
    name: manifest
    needs: [tags, build]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: join platforms
        env:
          TAGS: ${{ needs.tags.outputs.tags }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          while IFS= read -r tag; do
            [ -n "$tag" ] || continue
            docker buildx imagetools create --tag "$tag" "$IMAGE:$SHA-amd64" "$IMAGE:$SHA-arm64"
          done <<< "$TAGS"
