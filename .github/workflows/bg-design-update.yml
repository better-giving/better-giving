# Copy to .github/workflows/bg-design-update.yml in an app that uses the
# design registry. It checks the registry every weekday and keeps one PR, from
# the branch design-registry/update, open while a component you copied in has a
# newer version. Components you edited locally are left alone and listed in the
# PR. Commits you add to that branch are kept: the job never overwrites a branch
# that has a commit by anyone but github-actions[bot].
#
# Needs: Settings → Actions → General → "Allow GitHub Actions to create and
# approve pull requests".
#
# Checks on the PR: a PR opened or updated with the default GITHUB_TOKEN does
# create runs of your CI and design-check, but they wait for approval: a user
# with write access must choose "Approve workflows to run" on the PR, and required
# checks stay "Expected" until then. Add a repo secret DESIGN_REGISTRY_PR_TOKEN (a
# fine-grained PAT or GitHub App token with contents + pull requests write) and
# the push and the PR use it instead, which starts them without approval. Issues
# are always listed, opened and closed with the default GITHUB_TOKEN (issues:
# write below), so this token needs no issues permission.
#
# Which locks: an app can hold more than one bg-design.json (a root lock plus
# one per package, say). The job updates every lock in one run and opens one PR.
# Which locks it updates, first match wins:
#   1. LOCKS below: paths to lock files, relative to the repo root, separated by
#      newlines or spaces (no spaces inside a path). Each is updated with
#      `--lock <path>`; its "dir" is read against the repo root.
#   2. APP_DIR, when it is set to anything but "." (the way a single-lock copy of
#      this file was configured): the one lock at APP_DIR/bg-design.json, with
#      its "dir" read against APP_DIR. LOCKS wins over APP_DIR when both are set.
#   3. Discovery, with both left at their defaults: the root bg-design.json and
#      every packages/*/bg-design.json that exists. Only packages/* is searched;
#      locks anywhere else (apps/*, say) need LOCKS. Discovery reads every
#      "dir" against the repo root, so a lock in packages/<d> whose dir is not
#      inside packages/<d>/ (a dir written from the package, like "src") fails
#      the job before the CLI runs: set APP_DIR to the package for a single
#      lock, or LOCKS with root-relative dirs.
# Every lock, however it is found, must be a plain relative path to an existing
# regular file (not a symlink, not under .git or .github, not outside the repo;
# an absolute LOCKS entry, or an absolute APP_DIR when LOCKS is empty, is
# refused). A missing one fails the job, and so does discovery that finds none.
# No lock dir may hold another lock's dir or lock file; the job fails on an
# overlap ("src" next to "src-evil" is fine).
#
# Two jobs. "update" downloads the registry's CLI, checks it against the sha256
# in the registry's index.json and runs it, once per lock, with contents: read,
# no secrets and no write permission. It hands over an artifact: one patch per
# lock (the patch holds what that run of the CLI changed), the CLI's output and a
# version. "open-pr" holds the tokens and runs none of the registry's code. It
# works out the list of locks again from its own checkout, never from the
# artifact, and validates everything it takes from the artifact (a lock's patch
# may only touch that lock file and the item directory in that lock's "dir", and
# since lock dirs may not overlap, a patch cannot reach another lock's directory
# under the first one's name; only regular files, 100644 or 100755, and nothing
# under .github; the version must be a bare version; the output goes in the PR
# body inside a fence) and takes the CLI pin from its own download of
# index.json, never from the artifact. The hash comes from the same registry
# host as the CLI, so it catches a CLI that does not match its index, not a host
# that serves both.
#
# One PR for all the locks: the patches are applied in order into one commit. The
# PR body holds the CLI's output for every lock in one block, with a
# "== <lock path> ==" heading line per lock when there is more than one.
#
# One run at a time: a scheduled and a manual run started together would both
# push the update branch, and the second would fail to lock its ref.
#
# CLI pins: an app that pins the CLI in its own workflows (a versioned URL,
# /registry/cli/<version>/cli.mjs, and its sha256; see the README) keeps the
# marker comment bg-design-cli-pin, written after a #, on those lines. When the
# registry's index lists a newer CLI, the job also rewrites the version in the
# marked URL and the marked sha256, in a commit of its own pushed after the
# item update. Pushing a workflow file needs permission to write workflows: a
# fine-grained DESIGN_REGISTRY_PR_TOKEN needs Workflows: read and write, a
# classic one the workflow scope, and the default GITHUB_TOKEN cannot. When the
# push is refused the pin commit is dropped, the item update PR is kept and its
# body says "the CLI pin is behind: move <url> and <sha256>". When there are no
# item changes either, an issue carries that notice instead. The job closes that
# issue on any later run that finds the pin current or pushes the pin commit. A
# token that cannot write workflows never stops the update PR. A pin push that
# fails for any other reason is dropped too: the item PR is still kept, no issue
# opens, and the job fails so the next run retries.
# With Issues turned off, the "CLI pin is behind" notice of a release with no
# item changes appears only as a warning and in the job summary; the run passes.
#
# The design-registry-release dispatch below is a hook for your own tooling.
# The registry repo does not send it: its GITHUB_TOKEN cannot dispatch into
# another repo. The schedule is how updates normally arrive.
name: Update design registry

on:
  schedule:
    - cron: "17 14 * * 1-5"
  workflow_dispatch:
  repository_dispatch:
    types: [design-registry-release]

permissions:
  contents: read

# one run at a time; a queued run waits instead of cancelling the one pushing
concurrency:
  group: bg-design-update
  cancel-in-progress: false

env:
  REGISTRY: https://design.better.giving/registry
  # the lock files to update, separated by newlines or spaces, for example
  #   LOCKS: |
  #     bg-design.json
  #     packages/form/bg-design.json
  # empty: see "Which locks" in the header
  LOCKS: ""
  # a single lock at APP_DIR/bg-design.json, for copies that set it; used only
  # when LOCKS is empty and this is not "."
  APP_DIR: .

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      version: ${{ steps.update.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - name: Fetch the CLI
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/handoff"
          mkdir -p "$handoff"
          curl --fail --silent --show-error --location "${REGISTRY%/}/index.json" --output "$RUNNER_TEMP/index.json"
          # the CLI the index lists, at its versioned URL, with the sha256 it
          # publishes; nothing from the index but that shape is used
          listed=$(node -e '
            const { cli } = JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8"));
            const ok = cli
              && typeof cli.version === "string" && /^\d+\.\d+\.\d+$/.test(cli.version)
              && typeof cli.url === "string" && cli.url === `cli/${cli.version}/cli.mjs`
              && typeof cli.sha256 === "string" && /^[0-9a-f]{64}$/.test(cli.sha256);
            if (!ok) {
              console.error("the registry index lists no usable cli entry");
              process.exit(1);
            }
            console.log(cli.url, cli.sha256);
          ' "$RUNNER_TEMP/index.json")
          read -r cli_url cli_sha <<< "$listed"
          cli="$RUNNER_TEMP/bg-design.mjs"
          curl --fail --silent --show-error --location "${REGISTRY%/}/${cli_url}" --output "$cli"
          printf '%s  %s\n' "$cli_sha" "$cli" | sha256sum --check --strict -
      - name: Find the locks
        run: |
          set -euo pipefail
          # one line per lock: <app dir>, <lock path from there>, <lock path from
          # the repo root>, tab separated. The same step runs in both jobs and
          # reads only this checkout.
          node -e '
            const fs = require("node:fs");
            const path = require("node:path").posix;
            const fail = (m) => { console.error(`::error::${m}`); process.exit(1); };
            const plain = /^[A-Za-z0-9._@+\/-]+$/;
            const listed = (process.env.LOCKS || "").split(/\s+/).filter(Boolean);
            const raw_app_dir = process.env.APP_DIR || ".";
            // judged before normalizing and trimming the trailing slash, which would
            // turn "/" into "."; APP_DIR is ignored when LOCKS is set, so only an
            // APP_DIR in use is refused
            if (!listed.length && path.isAbsolute(raw_app_dir)) fail(`APP_DIR ${raw_app_dir} is an absolute path; set it relative to the repo root`);
            const app_dir = path.normalize(raw_app_dir).replace(/\/+$/, "") || ".";
            const found = [];
            if (listed.length) {
              for (const lock of listed) found.push({ app: ".", lock, how: "listed" });
            } else if (app_dir !== ".") {
              found.push({ app: app_dir, lock: "bg-design.json", how: "app" });
            } else {
              if (fs.existsSync("bg-design.json")) found.push({ app: ".", lock: "bg-design.json", how: "root" });
              if (fs.existsSync("packages"))
                for (const d of fs.readdirSync("packages").sort())
                  if (fs.existsSync(`packages/${d}/bg-design.json`)) found.push({ app: ".", lock: `packages/${d}/bg-design.json`, how: "package", package: `packages/${d}` });
            }
            if (!found.length) fail("no bg-design.json found: set LOCKS to the lock files to update");
            const seen = new Set();
            const rows = [];
            for (const { app, lock, how, package: pkg } of found) {
              // the paths go into shell loops and a patch check, so each is checked
              // rule by rule, each rule with its own message; absolute is judged
              // before the join, which would turn "/x" into "x"
              if (path.isAbsolute(lock)) fail(`${lock} is an absolute path; lock paths are relative to the repo root`);
              if (!plain.test(app)) fail(`APP_DIR ${JSON.stringify(app)} has characters other than letters, digits and . _ @ + / -`);
              if (!plain.test(lock)) fail(`${JSON.stringify(lock)} has characters other than letters, digits and . _ @ + / -`);
              const full = path.normalize(path.join(app, lock));
              if (full === ".." || full.startsWith("../")) fail(`${full} is outside the repo`);
              if (/^\.git(hub)?(\/|$)/.test(full)) fail(`${full} is under .git or .github`);
              let stat;
              try { stat = fs.lstatSync(full); } catch { fail(`${full} does not exist`); }
              if (stat.isSymbolicLink()) fail(`${full} is a symlink`);
              if (!stat.isFile()) fail(`${full} is not a regular file`);
              if (seen.has(full)) continue;
              seen.add(full);
              let dir;
              try {
                const doc = JSON.parse(fs.readFileSync(full, "utf8"));
                if (typeof doc.dir === "string") dir = path.normalize(path.join(app, doc.dir.replace(/\/+$/, "")));
              } catch {}
              // a lock found by discovery in packages/<d> is read from the repo
              // root; a dir that sits in its own package was written from there
              if (how === "package" && dir !== undefined && !dir.startsWith(`${pkg}/`))
                fail(`${full} has dir ${JSON.stringify(dir === "." ? "." : dir)}, which is outside ${pkg}/: the dir of this lock looks relative to its package. Set APP_DIR to the package for a single lock, or LOCKS with root-relative dirs.`);
              rows.push({ app, lock: path.normalize(lock), full, dir });
            }
            // each lock patch is judged against its own dir, so no dir may hold
            // another lock dir or lock file ("src" and "src-evil" are apart)
            const within = (p, d) => p === d || p.startsWith(`${d}/`);
            for (const a of rows) {
              if (a.dir === undefined) continue;
              for (const b of rows) {
                if (a === b) continue;
                if (within(b.full, a.dir)) fail(`${a.full} (dir ${a.dir}) holds the lock file ${b.full}: lock dirs must not overlap`);
                if (b.dir !== undefined && within(b.dir, a.dir)) fail(`${a.full} (dir ${a.dir}) holds the dir of ${b.full} (${b.dir}): lock dirs must not overlap`);
              }
            }
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/locks.tsv`, rows.map((r) => [r.app, r.lock, r.full].join("\t")).join("\n") + "\n");
          '
          cat "$RUNNER_TEMP/locks.tsv"
      - name: Take new versions
        id: update
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/handoff"
          cli="$RUNNER_TEMP/bg-design.mjs"
          locks="$RUNNER_TEMP/locks.tsv"
          count=$(wc -l < "$locks")
          : > "$handoff/update.txt"
          # the CLI runs once per lock, with an explicit --lock, from the lock's
          # app dir. After each run everything it changed is staged and diffed
          # against the tree the previous lock left, so each lock gets a patch of
          # its own run. No rename detection: every path open-pr checks is a plain
          # add, change or delete, and an empty patch means that lock changed
          # nothing.
          index=0
          first_version=""
          changed_version=""
          first_path=""
          changed_path=""
          prev=$(git write-tree) || exit 1
          while IFS=$'\t' read -r app lock path; do
            out="$RUNNER_TEMP/update-$index.txt"
            # no pipe, so the CLI's own exit code is the one tested; stdin is
            # /dev/null, or a CLI that reads it would eat the rest of the locks.
            # The step runs under bash -e (no shell: is named), so the code is
            # taken with || rather than $? on the next line, which -e would
            # never reach for a non-zero exit.
            code=0
            (cd "$app" && node "$cli" update --registry "$REGISTRY" --lock "$lock") < /dev/null > "$out" 2>&1 || code=$?
            cat "$out"
            if [ "$count" -gt 1 ]; then echo "== $path ==" >> "$handoff/update.txt"; fi
            cat "$out" >> "$handoff/update.txt"
            # 0 = updated, 3 = finished but skipped locally edited items (listed in
            # the PR). Anything else (1 runtime error, 2 usage) is a failure.
            case "$code" in
              0|3) ;;
              *) echo "::error::bg-design update failed with exit code $code for $path"; exit 1 ;;
            esac
            git add -A || exit 1
            tree=$(git write-tree) || exit 1
            git diff --cached --binary --no-renames "$prev" > "$handoff/items-$index.patch" || exit 1
            prev=$tree
            lock_version=$(node -p 'String(JSON.parse(require("node:fs").readFileSync(process.argv[1], "utf8")).registryVersion ?? "")' "$path") || exit 1
            if [ "$index" -eq 0 ]; then first_version=$lock_version; first_path=$path; fi
            if [ -z "$changed_path" ] && [ -s "$handoff/items-$index.patch" ]; then changed_version=$lock_version; changed_path=$path; fi
            index=$((index + 1))
          done < "$locks"
          # the PR's version is the first changed lock's, else the first lock's;
          # a changed lock with no usable version fails naming that lock
          if [ -n "$changed_path" ]; then version=$changed_version; version_path=$changed_path
          else version=$first_version; version_path=$first_path; fi
          # the version goes into a commit message and a PR title
          case "$version" in
            ""|*[!0-9A-Za-z._+-]*) echo "::error::$version_path has an unusable registryVersion"; exit 1 ;;
          esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: bg-design-update
          path: ${{ runner.temp }}/handoff
          if-no-files-found: error
          retention-days: 1

  # holds the tokens and runs none of the registry's code: it checks what the
  # update job handed over, applies the item patches, in order, takes the CLI pin from its
  # own download of the index, then commits, pushes and opens the PR or issue
  open-pr:
    needs: update
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # full history: the push guard compares the remote branch's commits
          fetch-depth: 0
          token: ${{ secrets.DESIGN_REGISTRY_PR_TOKEN || github.token }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: bg-design-update
          path: ${{ runner.temp }}/handoff
      - name: Find the locks
        run: |
          set -euo pipefail
          # one line per lock: <app dir>, <lock path from there>, <lock path from
          # the repo root>, tab separated. The same step runs in both jobs and
          # reads only this checkout.
          node -e '
            const fs = require("node:fs");
            const path = require("node:path").posix;
            const fail = (m) => { console.error(`::error::${m}`); process.exit(1); };
            const plain = /^[A-Za-z0-9._@+\/-]+$/;
            const listed = (process.env.LOCKS || "").split(/\s+/).filter(Boolean);
            const raw_app_dir = process.env.APP_DIR || ".";
            // judged before normalizing and trimming the trailing slash, which would
            // turn "/" into "."; APP_DIR is ignored when LOCKS is set, so only an
            // APP_DIR in use is refused
            if (!listed.length && path.isAbsolute(raw_app_dir)) fail(`APP_DIR ${raw_app_dir} is an absolute path; set it relative to the repo root`);
            const app_dir = path.normalize(raw_app_dir).replace(/\/+$/, "") || ".";
            const found = [];
            if (listed.length) {
              for (const lock of listed) found.push({ app: ".", lock, how: "listed" });
            } else if (app_dir !== ".") {
              found.push({ app: app_dir, lock: "bg-design.json", how: "app" });
            } else {
              if (fs.existsSync("bg-design.json")) found.push({ app: ".", lock: "bg-design.json", how: "root" });
              if (fs.existsSync("packages"))
                for (const d of fs.readdirSync("packages").sort())
                  if (fs.existsSync(`packages/${d}/bg-design.json`)) found.push({ app: ".", lock: `packages/${d}/bg-design.json`, how: "package", package: `packages/${d}` });
            }
            if (!found.length) fail("no bg-design.json found: set LOCKS to the lock files to update");
            const seen = new Set();
            const rows = [];
            for (const { app, lock, how, package: pkg } of found) {
              // the paths go into shell loops and a patch check, so each is checked
              // rule by rule, each rule with its own message; absolute is judged
              // before the join, which would turn "/x" into "x"
              if (path.isAbsolute(lock)) fail(`${lock} is an absolute path; lock paths are relative to the repo root`);
              if (!plain.test(app)) fail(`APP_DIR ${JSON.stringify(app)} has characters other than letters, digits and . _ @ + / -`);
              if (!plain.test(lock)) fail(`${JSON.stringify(lock)} has characters other than letters, digits and . _ @ + / -`);
              const full = path.normalize(path.join(app, lock));
              if (full === ".." || full.startsWith("../")) fail(`${full} is outside the repo`);
              if (/^\.git(hub)?(\/|$)/.test(full)) fail(`${full} is under .git or .github`);
              let stat;
              try { stat = fs.lstatSync(full); } catch { fail(`${full} does not exist`); }
              if (stat.isSymbolicLink()) fail(`${full} is a symlink`);
              if (!stat.isFile()) fail(`${full} is not a regular file`);
              if (seen.has(full)) continue;
              seen.add(full);
              let dir;
              try {
                const doc = JSON.parse(fs.readFileSync(full, "utf8"));
                if (typeof doc.dir === "string") dir = path.normalize(path.join(app, doc.dir.replace(/\/+$/, "")));
              } catch {}
              // a lock found by discovery in packages/<d> is read from the repo
              // root; a dir that sits in its own package was written from there
              if (how === "package" && dir !== undefined && !dir.startsWith(`${pkg}/`))
                fail(`${full} has dir ${JSON.stringify(dir === "." ? "." : dir)}, which is outside ${pkg}/: the dir of this lock looks relative to its package. Set APP_DIR to the package for a single lock, or LOCKS with root-relative dirs.`);
              rows.push({ app, lock: path.normalize(lock), full, dir });
            }
            // each lock patch is judged against its own dir, so no dir may hold
            // another lock dir or lock file ("src" and "src-evil" are apart)
            const within = (p, d) => p === d || p.startsWith(`${d}/`);
            for (const a of rows) {
              if (a.dir === undefined) continue;
              for (const b of rows) {
                if (a === b) continue;
                if (within(b.full, a.dir)) fail(`${a.full} (dir ${a.dir}) holds the lock file ${b.full}: lock dirs must not overlap`);
                if (b.dir !== undefined && within(b.dir, a.dir)) fail(`${a.full} (dir ${a.dir}) holds the dir of ${b.full} (${b.dir}): lock dirs must not overlap`);
              }
            }
            fs.writeFileSync(`${process.env.RUNNER_TEMP}/locks.tsv`, rows.map((r) => [r.app, r.lock, r.full].join("\t")).join("\n") + "\n");
          '
          cat "$RUNNER_TEMP/locks.tsv"
      - name: Check the handoff
        env:
          VERSION: ${{ needs.update.outputs.version }}
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/handoff"
          locks="$RUNNER_TEMP/locks.tsv"
          # the version goes into a commit message and a PR title
          [[ $VERSION =~ ^[0-9A-Za-z._+-]+$ ]] || { echo "::error::the update job's version is not a plain version"; exit 1; }
          # the check that counts judges the result, not the patch text: each
          # lock's patch is applied, in order, to a scratch index (this checkout
          # stays untouched) and what it changed is read back against the index
          # before it, every path and mode NUL separated and whole. The patches
          # are those of the locks this job found itself, by position; any other
          # patch in the artifact is never read.
          index="$RUNNER_TEMP/check.index"
          rm -f "$index"
          GIT_INDEX_FILE="$index" git read-tree HEAD
          n=0
          while IFS=$'\t' read -r app lock path; do
            patch="$handoff/items-$n.patch"
            n=$((n + 1))
            [ -s "$patch" ] || continue
            # first filter: the update job uses no rename detection, so a patch
            # with a rename or copy header is forged
            if grep -qE '^(rename|copy) (from|to|old|new) |^similarity index ' "$patch"; then
              echo "::error::the item update for $path renames or copies a file; not pushing it"
              exit 1
            fi
            before=$(GIT_INDEX_FILE="$index" git write-tree)
            # a patch that does not apply is refused below, after the item directory
            # is checked, so the first thing wrong with it is the one reported
            apply_error=""
            : > "$RUNNER_TEMP/changes.bin"
            if GIT_INDEX_FILE="$index" git apply --cached "$patch" 2> "$RUNNER_TEMP/apply.err"; then
              GIT_INDEX_FILE="$index" git diff --cached --no-renames --raw -z "$before" > "$RUNNER_TEMP/changes.bin"
            else
              apply_error=$(tr '\n' ' ' < "$RUNNER_TEMP/apply.err")
            fi
            # only this lock and its item directory may change, both read from this
            # checkout, never from the artifact, and only as regular files
            APPLY_ERROR="$apply_error" APP="$app" LOCK="$lock" node -e '
              const fs = require("node:fs");
              const path = require("node:path").posix;
              const app = process.env.APP;
              const lock_file = path.normalize(path.join(app, process.env.LOCK));
              const lock = JSON.parse(fs.readFileSync(lock_file, "utf8"));
              // a dir written with a trailing slash ("src/ui/") names the same directory
              const dir = typeof lock.dir === "string" ? path.normalize(path.join(app, lock.dir.replace(/\/+$/, ""))) : "";
              const usable = dir && dir !== "." && !path.isAbsolute(dir) && !dir.startsWith("..") && !/^\.git(hub)?(\/|$)/.test(dir);
              const fail = (m) => { console.error(`::error::${m}`); process.exit(1); };
              if (!usable) fail(`${lock_file} names no usable item directory`);
              if (process.env.APPLY_ERROR) fail(`the item update for ${lock_file} does not apply: ${process.env.APPLY_ERROR}`);
              const allowed = (p) => p === lock_file || (p.startsWith(`${dir}/`) && !p.split("/").includes(".."));
              const tokens = fs.readFileSync(process.argv[1], "latin1").split("\0");
              const text = (s) => Buffer.from(s, "latin1").toString("utf8");
              const changes = [];
              for (let i = 0; i < tokens.length; i += 2) {
                if (!tokens[i]) continue;
                const m = /^:(\d{6}) (\d{6}) [0-9a-f]+ [0-9a-f]+ ([A-Z])\d*$/.exec(tokens[i]);
                if (!m || tokens[i + 1] === undefined) fail("the item update has an entry this check cannot read");
                changes.push({ mode: m[2], status: m[3], path: text(tokens[i + 1]) });
              }
              const bad = changes.filter((c) => !allowed(c.path));
              if (bad.length) fail(`the item update for ${lock_file} touches ${bad.length} path(s) outside ${dir}/ and ${lock_file}, for example ${JSON.stringify(bad[0].path)}; not pushing it`);
              // a deleted entry has mode 000000; anything else must be a regular file
              const odd = changes.filter((c) => c.status !== "D" && c.mode !== "100644" && c.mode !== "100755");
              if (odd.length) fail(`the item update for ${lock_file} has a mode other than 100644 or 100755 (a symlink or submodule, say) at ${JSON.stringify(odd[0].path)}; not pushing it`);
            ' "$RUNNER_TEMP/changes.bin"
          done < "$locks"
      - name: Find the CLI pin
        run: |
          set -euo pipefail
          pin_dir="$RUNNER_TEMP/pin"
          mkdir -p "$pin_dir"
          rm -f "$pin_dir"/pin.txt "$pin_dir"/pin.behind "$pin_dir"/pin.version "$pin_dir"/pin-moved.txt "$pin_dir"/index.json
          mapfile -d '' files < <(grep -rlZE '#[[:space:]]*bg-design-cli-pin' .github/workflows 2>/dev/null || true)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "no workflow carries a bg-design-cli-pin line"
            exit 0
          fi
          # the pin comes from this job's own download of the index, never from
          # the artifact; a failed download stops the job before anything is
          # pushed, and the next run tries again
          if ! curl --fail --silent --show-error --location "${REGISTRY%/}/index.json" --output "$pin_dir/index.json"; then
            echo "::error::the registry index could not be downloaded for the CLI pin; nothing was pushed, the next run tries again"
            exit 1
          fi
          # the rewrite: a marked line holding /cli/<version>/cli.mjs names the
          # pinned version; when the index's differs, that URL and the sha256 on
          # the marked lines of the same file move to the index's. Without WRITE
          # it only reports (exit 10 when a pin is behind).
          cat > "$RUNNER_TEMP/pin.mjs" <<'JS'
          import { readFileSync, writeFileSync } from "node:fs";
          const MARK = /#\s*bg-design-cli-pin\b/;
          const URL_AT = /\/cli\/(\d+\.\d+\.\d+)\/cli\.mjs/;
          const URL_ALL = /https?:\/\/[^\s"']*?\/cli\/\d+\.\d+\.\d+\/cli\.mjs/;
          const [index_file, ...files] = process.argv.slice(2);
          const { cli } = JSON.parse(readFileSync(index_file, "utf8"));
          if (!cli) {
            console.log("the registry lists no cli version; pins left alone");
            process.exit(0);
          }
          // these values are written into workflow files that a token able to
          // write workflows pushes, so nothing but the shape the registry
          // publishes gets through
          const shape = {
            version: (v) => /^\d+\.\d+\.\d+$/.test(v),
            sha256: (v) => /^[0-9a-f]{64}$/.test(v),
            url: (v) => v === `cli/${cli.version}/cli.mjs`,
          };
          for (const [key, ok] of Object.entries(shape)) {
            if (typeof cli[key] !== "string" || !ok(cli[key])) {
              console.error(`the registry index's cli.${key} is malformed: ${JSON.stringify(cli[key])}; pins left alone`);
              process.exit(1);
            }
          }
          let behind = false;
          for (const file of files) {
            const lines = readFileSync(file, "utf8").split("\n");
            const marked = lines.flatMap((l, i) => (MARK.test(l) ? [i] : []));
            const pinned = marked.map((i) => URL_AT.exec(lines[i])?.[1]).find(Boolean);
            if (!pinned) {
              console.log(`${file}: a bg-design-cli-pin line names no /cli/<version>/cli.mjs URL; left alone`);
              continue;
            }
            if (pinned === cli.version) continue;
            if (process.env.WRITE === "1") {
              for (const i of marked)
                lines[i] = lines[i]
                  .replace(URL_AT, () => `/${cli.url}`)
                  .replace(/\b[0-9a-f]{64}\b/, () => cli.sha256);
              writeFileSync(file, lines.join("\n"));
              console.log(`${file}: bg-design cli ${pinned} → ${cli.version}`);
            } else {
              behind = true;
              const old_url = marked.map((i) => URL_ALL.exec(lines[i])?.[0]).find(Boolean) ?? "";
              console.log(`${file}: the CLI pin is behind: move ${old_url.replace(URL_AT, () => `/${cli.url}`)} and ${cli.sha256}`);
            }
          }
          process.exit(behind ? 10 : 0);
          JS
          rc=0
          node "$RUNNER_TEMP/pin.mjs" "$pin_dir/index.json" "${files[@]}" > "$pin_dir/pin.txt" 2> "$RUNNER_TEMP/pin.err" || rc=$?
          cat "$pin_dir/pin.txt"
          case "$rc" in
            0) ;;
            10)
              touch "$pin_dir/pin.behind"
              node -p 'require(process.argv[1]).cli.version' "$pin_dir/index.json" > "$pin_dir/pin.version"
              [[ $(<"$pin_dir/pin.version") =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::the CLI pin version is not a plain version"; exit 1; }
              ;;
            *)
              echo "::warning::the CLI pins were not read (exit code $rc): $(tr '\n' ' ' < "$RUNNER_TEMP/pin.err"); pins left alone"
              rm -f "$pin_dir/pin.txt"
              ;;
          esac
      - name: Open the PR
        env:
          GH_TOKEN: ${{ secrets.DESIGN_REGISTRY_PR_TOKEN || github.token }}
          ISSUES_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.update.outputs.version }}
          BOT_EMAIL: 41898282+github-actions[bot]@users.noreply.github.com
        run: |
          set -euo pipefail
          handoff="$RUNNER_TEMP/handoff"
          pin_dir="$RUNNER_TEMP/pin"
          branch="design-registry/update"
          pin_title="Move the bg-design CLI pin"

          # issues: write is granted to the job's token, not to the PR token
          gh_issue() { GH_TOKEN="$ISSUES_TOKEN" gh issue "$@"; }
          # --search filters before --limit cuts, so no number of other open
          # issues hides the pin issue
          open_pin_issues() {
            gh_issue list --state open --search "in:title \"$pin_title\"" --limit 100 \
              --json number,title --jq ".[] | select(.title | startswith(\"$pin_title\")) | .number"
          }
          # prints file $1 in a code fence longer than any run of backticks in it,
          # with a zero-width space after each @ so it mentions no one
          fenced() {
            local longest fence
            longest=$({ grep -o '`*' "$1" || true; } | awk '{ if (length($0) > m) m = length($0) } END { print m + 0 }')
            [ "$longest" -ge 3 ] || longest=2
            fence=$(printf '`%.0s' $(seq 1 $((longest + 1))))
            echo "$fence"
            awk -v z="$(printf '\342\200\213')" '{ gsub(/@/, "@" z); print }' "$1"
            echo "$fence"
          }
          # a cleanup: an app with no pin line never had a pin issue, and a
          # failure here (Issues turned off, say) warns instead of failing the job
          close_pin_issues() {
            local numbers n
            # the pin step writes pin.txt only when some workflow is marked
            [ -f "$pin_dir/pin.txt" ] || return 0
            if ! numbers=$(open_pin_issues); then
              echo "::warning::could not list open issues to close a \"${pin_title}\" issue; close it by hand if there is one"
              return 0
            fi
            for n in $numbers; do
              gh_issue close "$n" --comment "$1" ||
                echo "::warning::could not close issue #${n}; close it by hand"
            done
          }

          # the patches of the locks this job found, by position
          patches=()
          n=0
          while IFS= read -r _; do
            [ -s "$handoff/items-$n.patch" ] && patches+=("$handoff/items-$n.patch")
            n=$((n + 1))
          done < "$RUNNER_TEMP/locks.tsv"
          items=false
          [ "${#patches[@]}" -gt 0 ] && items=true
          behind=false
          [ -f "$pin_dir/pin.behind" ] && behind=true
          if [ "$behind" = false ]; then
            close_pin_issues "The CLI pin is current."
          fi
          if [ "$items" = false ] && [ "$behind" = false ]; then
            echo "design registry already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "$BOT_EMAIL"
          # git asks gh for credentials, and gh answers with GH_TOKEN; nothing
          # holding the token is written
          gh auth setup-git
          base=$(git rev-parse HEAD)

          # reads the update branch into remote_sha (empty when absent); returns
          # 3 when someone else has committed to it, 1 when origin cannot be read
          read_remote() {
            local rc=0 others
            remote_sha=""
            # ls-remote exits 2 when the branch is absent; any other failure is real
            git ls-remote --exit-code --heads origin "$branch" >/dev/null || rc=$?
            case "$rc" in
              0) ;;
              2) return 0 ;;
              *) return 1 ;;
            esac
            git fetch --no-tags origin "+refs/heads/${branch}:refs/remotes/origin/${branch}" || return 1
            remote_sha=$(git rev-parse "origin/${branch}")
            # commits on the remote branch that the default branch does not have
            others=$(git log --format='%ae' "$remote_sha" --not "$base" | grep -vxF "$BOT_EMAIL" || true)
            if [ -n "$others" ]; then
              echo "::warning::origin/${branch} has commits that are not from github-actions[bot]; leaving it alone. Merge or close that PR, or delete the branch, to resume updates."
              return 3
            fi
          }
          remote_has_tree() {
            [ -n "$remote_sha" ] && [ "$(git rev-parse "${remote_sha}^{tree}")" = "$(git rev-parse "${1}^{tree}")" ]
          }
          # pushes commit $1 to the update branch, leased on remote_sha; git's
          # stderr is kept in push.err for the caller to read
          push_commit() {
            local rc=0
            if remote_has_tree "$1"; then
              echo "origin/${branch} already has this tree; not pushing"
              return 0
            fi
            if [ -n "$remote_sha" ]; then
              git push --force-with-lease="refs/heads/${branch}:${remote_sha}" origin "${1}:refs/heads/${branch}" 2>"$RUNNER_TEMP/push.err" || rc=$?
            else
              git push origin "${1}:refs/heads/${branch}" 2>"$RUNNER_TEMP/push.err" || rc=$?
            fi
            cat "$RUNNER_TEMP/push.err" >&2
            if [ "$rc" -eq 0 ]; then remote_sha=$1; fi
            return "$rc"
          }

          # both commits are made before any push, so a branch that already
          # holds the final tree (an open PR, its items re-applied today) gets
          # no push at all
          git checkout -B "$branch"
          if [ "$items" = true ]; then
            for patch in "${patches[@]}"; do
              git apply --index "$patch"
            done
            git commit -m "Update design registry to ${VERSION}"
          fi
          items_head=$(git rev-parse HEAD)
          pin_head=""
          if [ "$behind" = true ]; then
            mapfile -d '' files < <(grep -rlZE '#[[:space:]]*bg-design-cli-pin' .github/workflows)
            WRITE=1 node "$RUNNER_TEMP/pin.mjs" "$pin_dir/index.json" "${files[@]}" > "$pin_dir/pin-moved.txt"
            git add -A
            git commit -m "Move the bg-design CLI pin to $(cat "$pin_dir/pin.version")"
            pin_head=$(git rev-parse HEAD)
          fi

          rc=0
          read_remote || rc=$?
          case "$rc" in
            0) ;;
            3) exit 0 ;;
            *) echo "::error::could not read the ${branch} branch on origin"; exit 1 ;;
          esac

          # pin_push: pushed, refused (the token cannot write workflows) or failed
          # (anything else); the pin goes after the item update, so neither drops
          # the items
          pin_push=""
          if remote_has_tree HEAD; then
            echo "origin/${branch} already has this tree; not pushing"
            if [ "$behind" = true ]; then pin_push=pushed; fi
          else
            if [ "$items" = true ]; then
              if ! push_commit "$items_head"; then
                echo "::error::pushing the item update to ${branch} failed"
                exit 1
              fi
            fi
            if [ "$behind" = true ]; then
              if push_commit "$pin_head"; then
                pin_push=pushed
              else
                # GitHub's refusal names the actor: "refusing to allow a Personal
                # Access Token / an OAuth App / a GitHub App to create or update
                # workflow `<path>` without `workflow` scope / `workflows` permission"
                if grep -qE 'refusing to allow .+ to create or update workflow' "$RUNNER_TEMP/push.err"; then
                  pin_push=refused
                  echo "::warning::the CLI pin was not pushed: the token cannot write workflows; the pin is left behind"
                else
                  pin_push=failed
                fi
                git reset --hard "$items_head"
              fi
            fi
          fi

          if [ "$pin_push" = failed ]; then
            pin_error="pushing the CLI pin commit failed: $(grep -m1 -E '^( ! |fatal: )' "$RUNNER_TEMP/push.err" || tail -n 1 "$RUNNER_TEMP/push.err")"
            if [ "$items" = false ]; then
              echo "::error::${pin_error}; the next run tries again"
              exit 1
            fi
          fi

          if [ "$items" = false ] && [ "$pin_push" = refused ]; then
            # nothing to open a PR for: the notice goes in an issue
            title="${pin_title} to $(cat "$pin_dir/pin.version")"
            {
              cat "$pin_dir/pin.txt"
              echo
              echo "The update job could not push the change: pushing a workflow file needs a DESIGN_REGISTRY_PR_TOKEN that can write workflows (a fine-grained token: Workflows, read and write; a classic token: the workflow scope). Edit the lines marked bg-design-cli-pin by hand, or fix the token and run this workflow again."
            } > "$RUNNER_TEMP/issue.md"
            # without Issues (turned off, or no permission) the notice goes to a
            # warning and the job summary instead: the update itself is not at fault
            published=false
            if numbers=$(open_pin_issues); then
              number=${numbers%%$'\n'*}
              if [ -n "$number" ]; then
                gh_issue edit "$number" --title "$title" --body-file "$RUNNER_TEMP/issue.md" && published=true
              else
                gh_issue create --title "$title" --body-file "$RUNNER_TEMP/issue.md" && published=true
              fi
            fi
            if [ "$published" = false ]; then
              echo "::warning::the CLI pin is behind and no issue could be opened for it (Issues turned off, or no permission to write them?): $(tr '\n' ' ' < "$RUNNER_TEMP/issue.md")"
              cat "$RUNNER_TEMP/issue.md" >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
            fi
            exit 0
          fi

          if [ "$items" = true ]; then
            title="Update design registry to ${VERSION}"
          else
            title="Update bg-design CLI pin to $(cat "$pin_dir/pin.version")"
          fi
          {
            echo "## Summary"
            echo
            if [ "$items" = true ]; then
              echo "Updates the design registry components to registry ${VERSION}."
              echo
              fenced "$handoff/update.txt"
              echo
              echo "If a pnpm add line is listed above, run it: the new version needs those packages."
            fi
            if [ "$pin_push" = pushed ]; then
              echo
              echo "Moves the pinned bg-design CLI."
              echo
              fenced "$pin_dir/pin-moved.txt"
            elif [ "$pin_push" = failed ]; then
              echo
              echo "The CLI pin commit could not be pushed; the next run tries again."
            elif [ "$pin_push" = refused ]; then
              echo
              fenced "$pin_dir/pin.txt"
              echo
              echo "The CLI pin was not moved: pushing a workflow file needs a DESIGN_REGISTRY_PR_TOKEN that can write workflows (fine-grained: Workflows, read and write; classic: the workflow scope)."
            fi
          } > "$RUNNER_TEMP/body.md"
          # open PRs only: a closed one is not reused, so a new one can open
          number=$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr create --head "$branch" --title "$title" --body-file "$RUNNER_TEMP/body.md"
          fi
          if [ "$pin_push" = pushed ]; then
            close_pin_issues "The pin commit is on the ${branch} branch, in the update PR."
          fi
          if [ "$pin_push" = failed ]; then
            echo "::error::${pin_error}; the item PR is up to date and the next run tries the pin again"
            exit 1
          fi
