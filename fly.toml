kill_signal = "SIGTERM"
kill_timeout = 30

[env]
  PORT = "3000"
  HOST = "0.0.0.0"
  DATABASE_URL = "file:/data/better-giving.db"
  TRUSTED_PROXY_HEADER = "fly-client-ip"

# release_command has no volume, so migrate runs here; exec so SIGTERM reaches node
[processes]
  app = 'sh -c "node scripts/migrate.ts && exec node server/index.ts"'

[http_service]
  internal_port = 3000
  force_https = true
  processes = ["app"]
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"

  [[http_service.checks]]
    grace_period = "30s"
    interval = "30s"
    method = "GET"
    timeout = "5s"
    path = "/login"

[mounts]
  source = "better_giving_data"
  destination = "/data"
  initial_size = "1gb"
  snapshot_retention = 14

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
